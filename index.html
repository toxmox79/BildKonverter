<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#93c01f" />
    <meta name="description" content="Konvertieren Sie Ihre Bilder zu JPG mit 1600x1600 Pixeln" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Bild Konverter PWA</title>
    <style>
        /* (Dein bestehendes CSS kann hier bleiben – aus Platzgründen weggelassen) */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🎨 Bild Konverter PWA</div>
        <div class="info">Konvertieren Sie Ihre Bilder zu JPG mit 1600x1600 Pixeln</div>
        <div class="url-input">
            <input type="text" id="imageUrl" placeholder="Bild-URL einfügen" />
            <button onclick="loadFromUrl()">URL laden</button>
        </div>
        <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" accept="image/*" style="display: none;" />
            <label for="fileInput" class="drop-zone-label">📸 Bild auswählen oder hier ablegen</label>
        </div>
        <div class="preview" id="preview">
            <img id="previewImg" src="" alt="Vorschau" />
        </div>
        <div class="controls">
            <input type="range" id="zoomSlider" min="0.1" max="10" step="0.1" value="1" class="slider" />
            <button onclick="resetView()">🔄 Zurücksetzen</button>
            <button onclick="deleteImage()">🗑️ Bild löschen</button>
            <button onclick="downloadImage()">💾 Als JPG herunterladen</button>
        </div>
        <div class="info">
            Original Format: <span id="origFormat">-</span><br />
            Original Größe: <span id="origSize">-</span><br />
            Aktueller Zoom: <span id="zoomLevel">100%</span>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('Service Worker registered'))
                .catch(err => console.error('SW registration failed:', err));
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const zoomSlider = document.getElementById('zoomSlider');
        const imageUrlInput = document.getElementById('imageUrl');

        let scale = 1;
        let posX = 0;
        let posY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFiles(files);
            else {
                const urlMatch = e.dataTransfer.getData('text/html')?.match(/src="([^"]+)"/);
                if (urlMatch && urlMatch[1]) loadImageFromUrl(urlMatch[1]);
            }
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            if (!files.length) return;
            const file = files[0];
            if (!file.type.startsWith('image/')) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => setImage(img.src, file.type.split('/')[1].toUpperCase(), img.width, img.height);
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function loadFromUrl() {
            const url = imageUrlInput.value.trim();
            if (!url) return;
            loadImageFromUrl(url);
        }

        function loadImageFromUrl(url) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => setImage(img.src, url.split('.').pop().toUpperCase(), img.width, img.height);
            img.onerror = () => alert('Bild konnte nicht geladen werden. Prüfe CORS oder die URL.');
            img.src = url;
        }

        function setImage(src, format, width, height) {
            previewImg.src = src;
            previewImg.style.display = 'block';
            document.getElementById('origFormat').textContent = format;
            document.getElementById('origSize').textContent = `${width} × ${height} px`;

            const preview = document.getElementById('preview');
            const pw = preview.offsetWidth, ph = preview.offsetHeight;
            scale = Math.min(pw / width, ph / height);
            posX = (pw - width * scale) / 2;
            posY = (ph - height * scale) / 2;
            updateTransform();
            zoomSlider.value = scale;
            document.getElementById('zoomLevel').textContent = `${(scale * 100).toFixed(0)}%`;
        }

        function updateTransform() {
            previewImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        function resetView() {
            scale = 1;
            posX = 0;
            posY = 0;
            updateTransform();
            zoomSlider.value = scale;
            document.getElementById('zoomLevel').textContent = '100%';
        }

        function deleteImage() {
            previewImg.src = '';
            previewImg.style.display = 'none';
            document.getElementById('origFormat').textContent = '-';
            document.getElementById('origSize').textContent = '-';
            document.getElementById('zoomLevel').textContent = '100%';
            scale = 1;
            posX = 0;
            posY = 0;
            updateTransform();
        }

        zoomSlider.addEventListener('input', (e) => {
            scale = parseFloat(e.target.value);
            updateTransform();
            document.getElementById('zoomLevel').textContent = `${(scale * 100).toFixed(0)}%`;
        });

        previewImg.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                posX = e.clientX - startX;
                posY = e.clientY - startY;
                updateTransform();
            }
        });

        document.addEventListener('mouseup', () => isDragging = false);

        function downloadImage() {
            if (!previewImg.src) {
                alert('Kein Bild geladen!');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = 1600;
            canvas.height = 1600;
            const ctx = canvas.getContext('2d');

            const tempImage = new Image();
            tempImage.crossOrigin = 'anonymous';
            tempImage.onload = () => {
                const previewRect = document.getElementById('preview').getBoundingClientRect();
                ctx.drawImage(
                    tempImage,
                    -posX * (1600 / previewRect.width) / scale,
                    -posY * (1600 / previewRect.height) / scale,
                    1600 / scale,
                    1600 / scale
                );

                const link = document.createElement('a');
                link.download = 'converted_image.jpg';
                link.href = canvas.toDataURL('image/jpeg');
                link.click();
            };
            tempImage.onerror = () => alert("Fehler beim Exportieren des Bildes.");
            tempImage.src = previewImg.src;
        }
    </script>
</body>
</html>
