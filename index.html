<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bild Konverter</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    body { font-family: sans-serif; background: #f5f5f5; text-align: center; }
    .container { background: white; max-width: 600px; margin: 40px auto; padding: 20px; border-radius: 10px; }
    .preview { width: 400px; height: 400px; border: 1px solid #ccc; margin: 10px auto; overflow: hidden; position: relative; background: #fff; }
    .preview img { position: absolute; top: 0; left: 0; transform-origin: 0 0; max-width: none; max-height: none; }
    input[type=range], input[type=text], input[type=file], button { margin: 10px 0; padding: 10px; width: 100%; max-width: 300px; }
    button { background: #93c01f; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .row > * { flex: 1 1 280px; }
    .hint { color:#555; font-size: 12px; margin-top: -6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bild Konverter</h1>

    <input type="text" id="imageUrl" placeholder="Bild-URL einfügen" />
    <button onclick="loadFromUrl()">🌐 URL laden</button>
    <button onclick="pasteFromClipboard()">📋 Aus Zwischenablage</button>
    <input type="file" id="fileInput" accept="image/*" />

    <div class="preview" id="preview"><img id="previewImg" alt="Vorschau" /></div>

    <input type="range" id="zoomSlider" min="0.05" max="20" step="0.001" value="1" />
    <p class="hint">Tipp: Mit dem Mausrad in kleineren Schritten zentriert zoomen.</p>

    <div class="row">
      <button onclick="resetView()">🔄 Zurücksetzen</button>
      <button onclick="deleteImage()">🗑️ Löschen</button>
    </div>

    <input type="text" id="imageName" placeholder="Dateiname ohne Endung (z. B. mein_bild)" />
    <button onclick="downloadImage()">💾 Als PNG herunterladen</button>

    <p id="zoomLevel">Zoom: 100%</p>
    <p>Original Format: <span id="origFormat">-</span><br />Größe: <span id="origSize">-</span></p>
  </div>

  <script>
    const preview = document.getElementById("preview");
    const previewImg = document.getElementById("previewImg");
    const zoomSlider = document.getElementById("zoomSlider");
    const imageUrlInput = document.getElementById("imageUrl");
    const imageNameInput = document.getElementById("imageName");

    let scale = 1, posX = 0, posY = 0, isDragging = false, startX = 0, startY = 0;

    function updateTransform() {
      previewImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }
    function updateZoomLabel() {
      const pct = (scale * 100).toFixed(1).replace('.0','');
      document.getElementById("zoomLevel").textContent = "Zoom: " + pct + "%";
    }
    function resetView() {
      scale = 1; posX = 0; posY = 0;
      updateTransform(); zoomSlider.value = 1;
      updateZoomLabel();
    }
    function deleteImage() {
      previewImg.src = "";
      document.getElementById("origFormat").textContent = "-";
      document.getElementById("origSize").textContent = "-";
      resetView();
    }

    // --- ZENTRIERTES ZOOMEN (Slider & Mausrad) ---
    function zoomTo(newScale, focalX = preview.offsetWidth / 2, focalY = preview.offsetHeight / 2) {
      const min = parseFloat(zoomSlider.min);
      const max = parseFloat(zoomSlider.max);
      newScale = Math.max(min, Math.min(max, newScale));

      // Bildkoordinate unter dem Fokuspunkt vor der Skalierung berechnen
      const imgX = (focalX - posX) / scale;
      const imgY = (focalY - posY) / scale;

      // Skalierung anwenden
      scale = newScale;

      // Neue Translation, damit derselbe Bildpunkt unter dem Fokus bleibt
      posX = focalX - imgX * scale;
      posY = focalY - imgY * scale;

      updateTransform();
      updateZoomLabel();
      zoomSlider.value = scale;
    }

    zoomSlider.addEventListener("input", () => {
      // Beim Schieberegler zum ZENTRUM der Vorschau zoomen
      zoomTo(parseFloat(zoomSlider.value));
    });

    // Mausrad-Zoom in kleinen, präzisen Schritten (zentriert)
    preview.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = 1 - Math.sign(e.deltaY) * 0.05; // 5% pro Schritt
      zoomTo(scale * factor);
    }, { passive: false });

    // Verschieben per Drag
    previewImg.addEventListener("mousedown", (e) => {
      isDragging = true; startX = e.clientX - posX; startY = e.clientY - posY; e.preventDefault();
    });
    document.addEventListener("mousemove", (e) => {
      if (isDragging) {
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateTransform();
      }
    });
    document.addEventListener("mouseup", () => { isDragging = false; });

    // --- PROXY-MANAGEMENT ---
    const PROXIES = [
      "https://corsproxy.io/?",
      "https://api.allorigins.win/raw?url=",
      "https://cors.bridged.cc/",
      "https://api.codetabs.com/v1/proxy?quest=",
    ];

    let workingProxy = localStorage.getItem("lastWorkingProxy");
    let proxyTimeouts = new Map(); // Speichert fehlgeschlagene Proxys mit Timeout

    async function testProxy(proxyUrl, imageUrl) {
      let testUrl;
      try {
        // Verschiedene Proxys haben unterschiedliche URL-Formate
        if (proxyUrl.includes('codetabs')) {
          testUrl = proxyUrl + encodeURIComponent(imageUrl);
        } else if (proxyUrl.includes('bridged')) {
          testUrl = proxyUrl + encodeURIComponent(imageUrl);
        } else {
          testUrl = proxyUrl + encodeURIComponent(imageUrl);
        }
        
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000); // 10 Sekunden Timeout
        
        const response = await fetch(testUrl, {
          signal: controller.signal,
          mode: 'cors',
          cache: 'no-cache',
          headers: {
            'Accept': 'image/*'
          }
        });
        
        clearTimeout(timeout);
        
        if (!response.ok) {
          console.warn(`Proxy ${proxyUrl} antwortete mit Status ${response.status}`);
          return null;
        }
        
        const blob = await response.blob();
        if (!blob.type.startsWith('image/') && blob.size > 0) {
          console.warn(`Proxy ${proxyUrl} lieferte kein Bild: ${blob.type}`);
          return null;
        }
        
        return { blob, proxy: proxyUrl };
      } catch (err) {
        console.warn(`Proxy ${proxyUrl} fehlgeschlagen:`, err.message);
        return null;
      }
    }

    async function findWorkingProxy(imageUrl) {
      // Sortiere Proxys: zuletzt funktionierender zuerst
      let sortedProxies = [...PROXIES];
      if (workingProxy && sortedProxies.includes(workingProxy)) {
        sortedProxies = [workingProxy, ...sortedProxies.filter(p => p !== workingProxy)];
      }

      // Entferne temporär blockierte Proxys
      const now = Date.now();
      sortedProxies = sortedProxies.filter(proxy => {
        const blockTime = proxyTimeouts.get(proxy);
        if (blockTime && blockTime > now) return false;
        return true;
      });

      // Versuche Proxys nacheinander
      for (const proxy of sortedProxies) {
        const result = await testProxy(proxy, imageUrl);
        if (result) {
          workingProxy = proxy;
          localStorage.setItem("lastWorkingProxy", proxy);
          // Setze kurzen Timeout für andere Proxys bei Erfolg
          proxyTimeouts.delete(proxy);
          return result;
        } else {
          // Blockiere diesen Proxy für 30 Sekunden
          proxyTimeouts.set(proxy, now + 30000);
        }
      }

      return null;
    }

    async function loadFromUrl() {
      const url = imageUrlInput.value.trim();
      if (!url) {
        alert("Bitte geben Sie eine URL ein.");
        return;
      }

      // Validiere URL
      try {
        new URL(url);
      } catch {
        alert("Ungültige URL.");
        return;
      }

      const statusEl = document.getElementById("zoomLevel");
      const originalText = statusEl.textContent;
      statusEl.textContent = "⏳ Lade Bild...";
      statusEl.style.color = "#ff9800";

      try {
        const result = await findWorkingProxy(url);
        if (!result) {
          throw new Error("Kein verfügbarer Proxy");
        }

        const objectUrl = URL.createObjectURL(result.blob);
        previewImg.src = objectUrl;
        previewImg.onload = () => {
          initImage(result.blob.type);
          statusEl.textContent = originalText;
          statusEl.style.color = "inherit";
        };
      } catch (err) {
        statusEl.textContent = originalText;
        statusEl.style.color = "inherit";
        alert("❌ Fehler: Kein Proxy konnte die Datei laden. Bitte überprüfen Sie die URL und versuchen Sie es später erneut.");
      }
    }

    async function pasteFromClipboard() {
      try {
        const items = await navigator.clipboard.read();
        for (let item of items) {
          if (item.types.includes('image/png') || item.types.includes('image/jpeg')) {
            const blob = await item.getType(item.types[0]);
            const url = URL.createObjectURL(blob);
            previewImg.src = url;
            previewImg.onload = () => initImage(blob.type);
            return;
          }
        }
      } catch { alert("Zwischenablage-Zugriff nicht möglich."); }
    }

    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        previewImg.src = event.target.result;
        previewImg.onload = () => initImage(file.type);
        // Dateinamenfeld automatisch füllen (ohne Endung)
        const base = (file.name || "").replace(/\.[^.]+$/, "");
        if (base) imageNameInput.value = base;
      };
      reader.readAsDataURL(file);
    });

    function initImage(type) {
      document.getElementById("origFormat").textContent = (type || "image/png").split("/")[1].toUpperCase();
      document.getElementById("origSize").textContent = previewImg.naturalWidth + " × " + previewImg.naturalHeight + " px";

      // Bild passend einpassen und zentrieren
      const fitScale = Math.min(preview.offsetWidth / previewImg.naturalWidth, preview.offsetHeight / previewImg.naturalHeight);
      scale = fitScale;
      posX = (preview.offsetWidth - previewImg.naturalWidth * scale) / 2;
      posY = (preview.offsetHeight - previewImg.naturalHeight * scale) / 2;
      updateTransform();
      zoomSlider.value = scale;
      updateZoomLabel();
    }

    function downloadImage() {
      const canvas = document.createElement("canvas");
      canvas.width = 1600;
      canvas.height = 1600;
      const ctx = canvas.getContext("2d");

      // Höchste Glättung aktivieren
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      // Sichtbaren Bereich der Vorschau auf das Canvas mappen
      const sx = -posX / scale;
      const sy = -posY / scale;
      const sWidth = preview.offsetWidth / scale;
      const sHeight = preview.offsetHeight / scale;
      ctx.drawImage(previewImg, sx, sy, sWidth, sHeight, 0, 0, 1600, 1600);

      // Dateinamen verwenden
      const base = (imageNameInput.value || "converted_image").trim() || "converted_image";
      const safeBase = base.replace(/[^a-zA-Z0-9_-]+/g, "_");

      const link = document.createElement("a");
      link.download = `${safeBase}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.log('Service Worker konnte nicht registriert werden:', err);
      });
    }
  </script>
</body>
</html>
