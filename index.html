<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bild Konverter</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      background: white;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 10px;
    }

    .preview {
      width: 400px;
      height: 400px;
      border: 1px solid #ccc;
      margin: 10px auto;
      overflow: hidden;
      position: relative;
      background: #fff;
    }

    .preview img {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      max-width: none;
      max-height: none;
    }

    input[type=range],
    input[type=text],
    input[type=file],
    button {
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      max-width: 300px;
    }

    button {
      background: #93c01f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .row>* {
      flex: 1 1 280px;
    }

    .hint {
      color: #555;
      font-size: 12px;
      margin-top: -6px;
    }

    /* Settings UI */
    .header-row {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .settings-btn {
      position: absolute;
      right: 0;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #555;
      width: auto;
      padding: 5px;
      margin: 0;
    }

    .settings-btn:hover {
      color: #93c01f;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      text-align: left;
      position: relative;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 10px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      color: #aaa;
    }

    .close:hover {
      color: black;
    }

    .proxy-list {
      list-style: none;
      padding: 0;
      margin: 15px 0;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 5px;
    }

    .proxy-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .proxy-item:last-child {
      border-bottom: none;
    }

    .proxy-item .url {
      flex-grow: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 10px;
    }

    .remove-btn {
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      padding: 2px 8px;
      width: auto;
      font-size: 12px;
      margin: 0;
    }

    .add-proxy-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .add-proxy-row input {
      flex-grow: 1;
      margin: 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .add-proxy-row button {
      width: auto;
      margin: 0;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header-row">
      <h1>Bild Konverter</h1>
      <button class="settings-btn" onclick="toggleSettings()" title="Proxy-Einstellungen">⚙️</button>
    </div>

    <input type="text" id="imageUrl" placeholder="Bild-URL einfügen" />
    <button onclick="loadFromUrl()">🌐 URL laden</button>
    <button onclick="pasteFromClipboard()">📋 Aus Zwischenablage</button>
    <input type="file" id="fileInput" accept="image/*" />

    <div class="preview" id="preview"><img id="previewImg" alt="Vorschau" /></div>

    <input type="range" id="zoomSlider" min="0.05" max="20" step="0.001" value="1" />
    <p class="hint">Tipp: Mit dem Mausrad in kleineren Schritten zentriert zoomen.</p>

    <div class="row">
      <button onclick="resetView()">🔄 Zurücksetzen</button>
      <button onclick="deleteImage()">🗑️ Löschen</button>
    </div>

    <input type="text" id="imageName" placeholder="Dateiname ohne Endung (z. B. mein_bild)" />
    <button onclick="downloadImage()">💾 Als PNG herunterladen</button>

    <p id="zoomLevel">Zoom: 100%</p>
    <p>Original Format: <span id="origFormat">-</span><br />Größe: <span id="origSize">-</span></p>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="toggleSettings()">&times;</span>
      <h2>Proxy-Einstellungen</h2>
      <p style="font-size: 14px; color: #666;">Fügen Sie eigene CORS-Proxys hinzu. Diese werden lokal in Ihrem Browser
        gespeichert.</p>

      <div id="proxyList" class="proxy-list">
        <!-- Proxies go here -->
      </div>

      <div class="add-proxy-row">
        <input type="text" id="newProxyUrl" placeholder="https://mein-proxy.de/?url=" />
        <button onclick="addCustomProxy()">➕ Hinzufügen</button>
      </div>
      <p class="hint" style="margin-top: 10px;">Hinweis: Die Standard-Proxys sind immer aktiv.</p>
    </div>
  </div>

  <script>
    const preview = document.getElementById("preview");
    const previewImg = document.getElementById("previewImg");
    const zoomSlider = document.getElementById("zoomSlider");
    const imageUrlInput = document.getElementById("imageUrl");
    const imageNameInput = document.getElementById("imageName");

    let scale = 1, posX = 0, posY = 0, isDragging = false, startX = 0, startY = 0;

    function updateTransform() {
      previewImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }
    function updateZoomLabel() {
      const pct = (scale * 100).toFixed(1).replace('.0', '');
      document.getElementById("zoomLevel").textContent = "Zoom: " + pct + "%";
    }
    function resetView() {
      scale = 1; posX = 0; posY = 0;
      updateTransform(); zoomSlider.value = 1;
      updateZoomLabel();
    }
    function deleteImage() {
      previewImg.src = "";
      document.getElementById("origFormat").textContent = "-";
      document.getElementById("origSize").textContent = "-";
      resetView();
    }

    // --- ZENTRIERTES ZOOMEN (Slider & Mausrad) ---
    function zoomTo(newScale, focalX = preview.offsetWidth / 2, focalY = preview.offsetHeight / 2) {
      const min = parseFloat(zoomSlider.min);
      const max = parseFloat(zoomSlider.max);
      newScale = Math.max(min, Math.min(max, newScale));

      // Bildkoordinate unter dem Fokuspunkt vor der Skalierung berechnen
      const imgX = (focalX - posX) / scale;
      const imgY = (focalY - posY) / scale;

      // Skalierung anwenden
      scale = newScale;

      // Neue Translation, damit derselbe Bildpunkt unter dem Fokus bleibt
      posX = focalX - imgX * scale;
      posY = focalY - imgY * scale;

      updateTransform();
      updateZoomLabel();
      zoomSlider.value = scale;
    }

    zoomSlider.addEventListener("input", () => {
      // Beim Schieberegler zum ZENTRUM der Vorschau zoomen
      zoomTo(parseFloat(zoomSlider.value));
    });

    // Mausrad-Zoom in kleinen, präzisen Schritten (zentriert)
    preview.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = 1 - Math.sign(e.deltaY) * 0.05; // 5% pro Schritt
      zoomTo(scale * factor);
    }, { passive: false });

    // Verschieben per Drag
    previewImg.addEventListener("mousedown", (e) => {
      isDragging = true; startX = e.clientX - posX; startY = e.clientY - posY; e.preventDefault();
    });
    document.addEventListener("mousemove", (e) => {
      if (isDragging) {
        posX = e.clientX - startX;
        posY = e.clientY - startY;
        updateTransform();
      }
    });
    document.addEventListener("mouseup", () => { isDragging = false; });

    // --- PROXY-MANAGEMENT ---
    const DEFAULT_PROXIES = [
      "https://images.weserv.nl/?url=",
      "https://corsproxy.io/?",
      "https://api.allorigins.win/raw?url=",
      "https://cors.bridged.cc/",
      "https://api.codetabs.com/v1/proxy?quest=",
      "https://cors-anywhere.herokuapp.com/",
      "https://proxy.cors.sh/",
      "https://cors.lol/?url=",
      "https://thingproxy.freeboard.io/fetch/",
    ];

    let customProxies = JSON.parse(localStorage.getItem("customProxies") || "[]");
    let workingProxy = localStorage.getItem("lastWorkingProxy");
    let proxyTimeouts = new Map();

    function getActiveProxies() {
      return [...new Set([...customProxies, ...DEFAULT_PROXIES])];
    }

    async function testProxy(proxyUrl, imageUrl) {
      try {
        // Sicherer: Immer voll encoden für alle Proxys
        const testUrl = proxyUrl + encodeURIComponent(imageUrl);

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 6000); // 6 Sekunden für den "Race"

        const response = await fetch(testUrl, {
          signal: controller.signal,
          mode: 'cors',
          cache: 'no-cache',
          headers: { 'Accept': 'image/*' }
        });

        clearTimeout(timeout);

        if (!response.ok) return null;

        const blob = await response.blob();
        if (!blob.type.startsWith('image/') && blob.size > 0) return null;

        return { blob, proxy: proxyUrl };
      } catch (err) {
        return null;
      }
    }

    async function findWorkingProxy(imageUrl) {
      const allProxies = getActiveProxies();
      const now = Date.now();

      // Filtere blockierte Proxys
      let sortedProxies = allProxies.filter(proxy => {
        const blockTime = proxyTimeouts.get(proxy);
        return !(blockTime && blockTime > now);
      });

      // 1. PHASE: Versuche den letzten funktionierenden Proxy zuerst (schneller Timeout)
      if (workingProxy && sortedProxies.includes(workingProxy)) {
        const result = await testProxy(workingProxy, imageUrl);
        if (result) return result;
        proxyTimeouts.set(workingProxy, now + 30000); // Kurz blockieren, wenn er jetzt fehlschlägt
      }

      // 2. PHASE: Parallel-Suche ("Race") unter den restlichen Proxys
      const remainingProxies = sortedProxies.filter(p => p !== workingProxy);

      // Starte alle restlichen Requests parallel
      const attempts = remainingProxies.map(async (proxy) => {
        const result = await testProxy(proxy, imageUrl);
        if (result) return result;
        proxyTimeouts.set(proxy, now + 30000);
        throw new Error("Proxy failed");
      });

      try {
        // Promise.any gibt das erste erfolgreiche Resultat zurück
        const result = await Promise.any(attempts);
        if (result) {
          workingProxy = result.proxy;
          localStorage.setItem("lastWorkingProxy", workingProxy);
          return result;
        }
      } catch (e) {
        console.warn("Alle Proxy-Versuche fehlgeschlagen");
      }

      return null;
    }

    // --- SETTINGS UI LOGIC ---
    function toggleSettings() {
      const modal = document.getElementById("settingsModal");
      const isVisible = modal.style.display === "block";
      modal.style.display = isVisible ? "none" : "block";
      if (!isVisible) renderProxyList();
    }

    function renderProxyList() {
      const list = document.getElementById("proxyList");
      list.innerHTML = "";

      customProxies.forEach((proxy, index) => {
        const div = document.createElement("div");
        div.className = "proxy-item";
        div.innerHTML = `
          <span class="url" title="${proxy}">${proxy}</span>
          <button class="remove-btn" onclick="removeProxy(${index})">Löschen</button>
        `;
        list.appendChild(div);
      });

      if (customProxies.length === 0) {
        list.innerHTML = '<p style="padding:10px; color:#999; text-align:center;">Keine eigenen Proxys hinzugefügt.</p>';
      }
    }

    function addCustomProxy() {
      const input = document.getElementById("newProxyUrl");
      let url = input.value.trim();
      if (!url) return;

      if (!url.startsWith("http")) {
        alert("URL muss mit http:// oder https:// beginnen.");
        return;
      }

      if (!customProxies.includes(url)) {
        customProxies.push(url);
        localStorage.setItem("customProxies", JSON.stringify(customProxies));
        input.value = "";
        renderProxyList();
      }
    }

    function removeProxy(index) {
      customProxies.splice(index, 1);
      localStorage.setItem("customProxies", JSON.stringify(customProxies));
      renderProxyList();
    }

    window.onclick = function (event) {
      const modal = document.getElementById("settingsModal");
      if (event.target == modal) toggleSettings();
    }

    async function loadFromUrl() {
      const url = imageUrlInput.value.trim();
      if (!url) {
        alert("Bitte geben Sie eine URL ein.");
        return;
      }

      // Validiere URL
      try {
        new URL(url);
      } catch {
        alert("Ungültige URL.");
        return;
      }

      const statusEl = document.getElementById("zoomLevel");
      const originalText = statusEl.textContent;
      statusEl.textContent = "⏳ Lade Bild...";
      statusEl.style.color = "#ff9800";

      try {
        const result = await findWorkingProxy(url);
        if (!result) {
          throw new Error("Kein verfügbarer Proxy");
        }

        const objectUrl = URL.createObjectURL(result.blob);
        previewImg.src = objectUrl;
        previewImg.onload = () => {
          initImage(result.blob.type);
          statusEl.textContent = originalText;
          statusEl.style.color = "inherit";
        };
      } catch (err) {
        statusEl.textContent = originalText;
        statusEl.style.color = "inherit";
        alert("❌ Fehler: Kein Proxy konnte die Datei laden. Bitte überprüfen Sie die URL und versuchen Sie es später erneut.");
      }
    }

    async function pasteFromClipboard() {
      try {
        const items = await navigator.clipboard.read();
        for (let item of items) {
          if (item.types.includes('image/png') || item.types.includes('image/jpeg')) {
            const blob = await item.getType(item.types[0]);
            const url = URL.createObjectURL(blob);
            previewImg.src = url;
            previewImg.onload = () => initImage(blob.type);
            return;
          }
        }
      } catch { alert("Zwischenablage-Zugriff nicht möglich."); }
    }

    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        previewImg.src = event.target.result;
        previewImg.onload = () => initImage(file.type);
        // Dateinamenfeld automatisch füllen (ohne Endung)
        const base = (file.name || "").replace(/\.[^.]+$/, "");
        if (base) imageNameInput.value = base;
      };
      reader.readAsDataURL(file);
    });

    function initImage(type) {
      document.getElementById("origFormat").textContent = (type || "image/png").split("/")[1].toUpperCase();
      document.getElementById("origSize").textContent = previewImg.naturalWidth + " × " + previewImg.naturalHeight + " px";

      // Bild passend einpassen und zentrieren
      const fitScale = Math.min(preview.offsetWidth / previewImg.naturalWidth, preview.offsetHeight / previewImg.naturalHeight);
      scale = fitScale;
      posX = (preview.offsetWidth - previewImg.naturalWidth * scale) / 2;
      posY = (preview.offsetHeight - previewImg.naturalHeight * scale) / 2;
      updateTransform();
      zoomSlider.value = scale;
      updateZoomLabel();
    }

    function downloadImage() {
      const canvas = document.createElement("canvas");
      canvas.width = 1600;
      canvas.height = 1600;
      const ctx = canvas.getContext("2d");

      // Höchste Glättung aktivieren
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      // Sichtbaren Bereich der Vorschau auf das Canvas mappen
      const sx = -posX / scale;
      const sy = -posY / scale;
      const sWidth = preview.offsetWidth / scale;
      const sHeight = preview.offsetHeight / scale;
      ctx.drawImage(previewImg, sx, sy, sWidth, sHeight, 0, 0, 1600, 1600);

      // Dateinamen verwenden
      const base = (imageNameInput.value || "converted_image").trim() || "converted_image";
      const safeBase = base.replace(/[^a-zA-Z0-9_-]+/g, "_");

      const link = document.createElement("a");
      link.download = `${safeBase}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('service-worker.js').catch(err => {
        console.log('Service Worker konnte nicht registriert werden:', err);
      });
    }
  </script>
</body>

</html>
